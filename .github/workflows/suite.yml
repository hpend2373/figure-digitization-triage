# Every test file is a standalone script that exits non-zero on the first
# failure, so CI is the same command a person runs. No pytest, no discovery, no
# collection order: a scenario that only passes when something else ran first is
# a scenario that proves nothing.
name: suite

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install the pinned environment
        run: python -m pip install -r requirements-lock.txt
      - name: record what we are running on
        run: python -c "import run_batch, json; print(json.dumps(run_batch.environment_record(), indent=1))"
      - name: suite
        run: |
          set -e
          for t in test_reproducibility test_kernel test_grid_engine \
                   test_bar_reader test_mark_readers test_mono_bar \
                   test_measure_mono_bars \
                   test_integration test_run_batch test_finalize \
                   test_compile_plan test_corpus_intake \
                   test_geometry_proposer; do
            echo "--- $t"
            python "$t.py"
          done
      - name: forward tests and worked examples
        run: |
          set -e
          for s in crosscheck_id323 build_id323 forward_test_397_mono_bar \
                   forward_test_127_mono_bar forward_test_397_mono_geometry \
                   forward_test_real_monochrome \
                   forward_test_beckers_geometry forward_test_beckers_dpi \
                   pilot_397; do
            echo "--- $s"
            python "$s.py"
          done
      # Publication 397 ships with 108 QC problems on purpose: its dispersion
      # definition is unresolved. A run that reproduces them exactly has done
      # its job, so this step asserts the expected verdict rather than a bare
      # exit code - a green here that did not read 48 values would be worse
      # than a red one.
      - name: the plan compiles and runs to the pilot's numbers
        run: |
          set -e
          python compile_plan.py plan_397.json /tmp/m --file-root . --date 2026-08-07
          python run_batch.py /tmp/m /tmp/o --file-root . --date 2026-08-07
          python - <<'PY'
          import json
          stamp = json.load(open("/tmp/o/run_stamp.json", encoding="utf-8"))
          assert stamp["Status"] == "RAN", stamp["Status"]
          assert stamp["Run_Mode"] == "DEMO_ONLY", stamp["Run_Mode"]
          # 36 since BAR_MONO moved to the two-pass reader: three Figure 4
          # panels now refuse with STROKE_SCALE_UNRESOLVED rather than
          # producing numbers off a stroke the reader could not measure.
          # test_compile_plan names them.
          assert stamp["Values_Read"] == 36, stamp["Values_Read"]
          assert stamp["Values_Machine_QC_Passed"] == 0, stamp
          assert stamp["Values_Accepted"] == 0, stamp
          assert stamp["QC_Problems"] == 127, stamp["QC_Problems"]
          assert stamp["Environment"]["Libraries"]["cv2"], stamp
          print("plan -> run reproduces the pilot:", stamp["Status"],
                stamp["Values_Read"], "read,", stamp["QC_Problems"], "qc problems")
          PY
