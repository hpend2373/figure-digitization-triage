<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plot Digitizer · 작업대</title>
<style>
/* Colors, system typography and radii adapted from GetDesign's Apple guide. */
:root {
  --canvas: #fff; --background: #f5f5f7; --pearl: #fafafc;
  --ink: #1d1d1f; --muted: #626266; --line: #e0e0e0; --blue: #0066cc;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--background); color: var(--ink); font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
header { min-height: 44px; padding: 8px 16px; background: var(--pearl); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
header h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.2px; }
small, .muted, #status { color: var(--muted); font-size: 12px; }
main { display: grid; grid-template-columns: minmax(138px, 170px) minmax(0, 1fr) minmax(288px, 330px); gap: 8px; padding: 8px; align-items: start; }
section, nav { min-width: 0; padding: 12px; background: var(--canvas); border: 1px solid var(--line); border-radius: 11px; }
h2 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
p { margin: 4px 0 8px; }
button, input { font: inherit; color: inherit; }
button { line-height: 16px; min-height: 26px; padding: 3px 8px; border: 1px solid transparent; border-radius: 5px; background: transparent; cursor: pointer; }
button:hover { background: var(--background); }
button[aria-pressed=true] { background: #eaf3fd; color: #0056ad; }
button:disabled { opacity: .46; cursor: default; }
button:focus-visible, input:focus-visible { outline: 2px solid #0071e3; outline-offset: 2px; }
nav button, td button { text-align: left; width: 100%; overflow-wrap: anywhere; }
nav button { display: block; margin-top: 2px; }
.tools, .fields { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.tools { margin: 6px 0 8px; }
.tool-group { display: inline-flex; gap: 1px; background: var(--background); border-radius: 8px; padding: 2px; }
.tool-group button { min-height: 24px; padding-block: 2px; }
.zoom { margin-left: auto; }
.viewport { height: clamp(330px, 65vh, 840px); overflow: auto; background: var(--pearl); border: 1px solid var(--line); border-radius: 8px; }
svg { display: block; max-width: none; cursor: crosshair; background: var(--canvas); }
table { border-collapse: collapse; width: 100%; font-size: 12px; font-variant-numeric: tabular-nums; }
th, td { padding: 3px; text-align: left; border-bottom: 1px solid #f0f0f0; overflow-wrap: anywhere; }
th { color: var(--muted); }
td button { padding: 2px 5px; }
.table { max-height: 45vh; overflow: auto; margin: 6px 0; }
label { font-size: 12px; display: grid; gap: 3px; min-width: 0; }
.fields { gap: 8px; }
.fields label { flex: 1 1 110px; }
.fields input { width: 100%; min-width: 0; min-height: 27px; padding: 3px 6px; background: var(--canvas); border: 1px solid var(--line); border-radius: 5px; }
.primary, .primary:hover { color: white; background: var(--blue); border-radius: 9999px; padding-inline: 10px; }
#panel-title { overflow-wrap: anywhere; }
@media (max-width: 1050px) { main { grid-template-columns: 138px minmax(0, 1fr); } .readings { grid-column: 2; } }
@media (max-width: 650px) { main { grid-template-columns: minmax(0, 1fr); } .readings { grid-column: auto; } .viewport { height: 48vh; } }
</style>
</head>
<body>
<header><h1>Plot Digitizer <small>· 작업대</small></h1><small id="saved" role="status"></small></header>
<main>
<nav aria-label="패널 목록"><h2>패널</h2><div id="panels"></div></nav>
<section aria-labelledby="panel-title">
<h2 id="panel-title"></h2><p id="axis" class="muted"></p>
<div class="tools" aria-label="판독 도구">
<div class="tool-group" role="group" aria-label="표시 종류">
<button data-mark="mean" aria-pressed="true">값</button>
<button data-mark="upper" aria-pressed="false">위쪽 끝</button>
<button data-mark="lower" aria-pressed="false">아래쪽 끝</button>
</div>
<button id="clear" aria-label="선택 표시 지우기">지우기</button>
<div class="tool-group zoom" role="group" aria-label="그림 확대"><button id="minus" aria-label="축소">−</button><button id="fit">맞춤</button><button id="plus" aria-label="확대">+</button></div>
</div>
<div id="viewport" class="viewport"><svg id="plot" aria-label="원본 플롯"><image id="raster"/><g id="marks" pointer-events="none"/></svg></div>
<p class="muted">판독표에서 셀을 고른 뒤 그림을 클릭하세요. 보이지 않는 오차막대 끝은 비워 두세요.</p>
</section>
<section class="readings" aria-labelledby="readings-title">
<h2 id="readings-title">판독표</h2><p id="count" class="muted"></p>
<div class="table"><table><thead><tr><th>계열 · 위치</th><th>값</th><th>위쪽</th><th>아래쪽</th></tr></thead><tbody id="cells"></tbody></table></div>
<p class="muted">표의 숫자는 축 교정에 따른 미리보기입니다. CSV에는 원본 픽셀을 담습니다.</p>
<div class="fields"><label>판독자 ID<input id="reader" autocomplete="off"></label><label>판독일<input id="date" type="date"></label></div>
<p id="status" role="status"></p>
<button id="download" class="primary" disabled>CSV 내보내기</button>
</section>
</main>
<script type="application/json" id="data">/* WORKBENCH_DATA */</script>
<script>/* WORKBENCH_JS */</script>
</body>
</html>
