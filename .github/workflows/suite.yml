# Every test file is a standalone script that exits non-zero on the first
# failure, so CI is the same command a person runs. No pytest, no discovery
# framework, no collection order: a scenario that only passes when something
# else ran first is a scenario that proves nothing.
#
# Two jobs, because `test_corpus_intake` and `test_tick_ocr` skip their PDF and
# OCR sections where the backends are absent:
#   core   the pinned environment only, with the PDF backends REMOVED, so the
#          count does not depend on what `ubuntu-latest` happens to ship
#   full   the pinned environment plus poppler, tesseract and the intake extras
name: suite

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install the pinned environment
        run: python -m pip install -r requirements-lock.txt
      - name: take away what the core profile does not install
        run: |
          sudo apt-get remove -y poppler-utils >/dev/null 2>&1 || true
          python -m pip uninstall -y pdfminer.six pypdf >/dev/null 2>&1 || true
          for b in pdftotext pdftoppm pdfinfo; do
            ! command -v "$b" || { echo "$b is still on PATH"; exit 1; }
          done
      - name: record what we are running on
        run: python -c "import sys; sys.path.insert(0, 'fdt'); import run_batch, json; print(json.dumps(run_batch.environment_record(), indent=1))"
      - name: page logic under node
        run: |
          set -e
          # The decisions that can put a number on the wrong figure are pure
          # functions in the pages' .js files; the page only moves values.
          for t in tests/test_*.mjs tests/sheet/test_*.mjs; do
            echo "--- $t"
            node "$t"
          done
      - name: python suites
        run: bash .github/run_suites.sh
      - name: quickstart example
        run: python examples/quickstart/quickstart.py /tmp/quickstart

  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install the pinned environment and the intake backends
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils tesseract-ocr
          python -m pip install -r requirements-lock.txt -r requirements-intake.txt
      - name: record the backends this run belongs to
        run: |
          pdftotext -v 2>&1 | head -1
          tesseract --version 2>&1 | head -1
          python -c "import importlib.metadata as m; print('pdfminer.six', m.version('pdfminer.six')); print('pypdf', m.version('pypdf'))"
      - name: python suites
        run: bash .github/run_suites.sh
      - name: the intake suite ran its PDF sections
        run: |
          ! python tests/test_corpus_intake.py | grep -q "SKIP the PDF adapter" || {
            echo "the PDF adapter still skipped in a job that installed the backend"
            exit 1
          }
